probing:
  try_reuse_repo: Yes
  sample_no: 400
  max_seqlen: 512
  dataset:
    path: allenai/c4
    name: en
    split: validation
  probes_repo: SzymonKozl/probes_gpt_oss_8_12_16_20
  layers: 
steering:
  layers:
    - [8]
    - [12]
    - [16]
    - [20]
    - [8, 12, 16, 20]
  include_baseline: Yes
  temperature: 1.0
  repeats_per_example: 10
  models:
    - openai/gpt-oss-20b
  samples:
    strongreject:
      path: data/strongreject_20_2137
  steering_algorithm:
    act_add:
      name: ProjectionSubtraction
      params:
        alpha:
          - 2.0
          - 10.0
  outputs_repo: SzymonKozl/role_steering_cf_sysprompt_proj
  max_new_tokens: 2048
  default_system_prompt: Yes
eval:
  # skip probing & steering, evaluate outputs already in steering.outputs_repo
  eval_only: No
  llm_as_a_judge_prompt: prompts/judge_instruction_1.txt
  llm_as_a_judge_model: deepseek/deepseek-v4.1-flash
modal:
  gpu: H100
  timeout: 3600
run_name: cf_strongreject_proj
wandb_project: role_steering
wandb_entity: sf-kozlowski-university-of-warsaw
wandb_group: role_science_reproduction
roles:
  - system
  - user
  - cot
  - tool
  - assistant