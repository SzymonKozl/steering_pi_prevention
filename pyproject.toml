[project]
name = "role-steering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SzymonKozl", email = "szymon.kozlowski.2003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "modal",
    "pyyaml",
    "wandb",
    "huggingface_hub",
